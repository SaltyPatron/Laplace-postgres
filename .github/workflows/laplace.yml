# Build the candidate extension and run the checks that need no database: no step here starts a server, makes a
# database or connects to one. Installation belongs to Operations' deployment after merge, and the regression cases
# (tests/deployed.sh) run there, against the deployed database and the installed extension (laplace.yml, job tests).
name: Laplace-postgres
env:
  LAPLACE_CONNINFO: ""   # laplace.env's
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  extension:
    runs-on: [self-hosted, laplace, Laplace-postgres]
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-postgres }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", ref: main, path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: Select qualified Native inputs for the exact source revision
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: bash Laplace-Operations/native-inputs.sh prepare "$GITHUB_WORKSPACE/Laplace-Native"
      - name: Verify Native source selection across reconfiguration
        run: cmake "-DSOURCE=$GITHUB_WORKSPACE/Laplace-postgres" "-DWORK=$RUNNER_TEMP/native-source-defaults" -P Laplace-postgres/tests/native-source-defaults.cmake
      - name: build
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_SRC=$GITHUB_WORKSPACE LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native
          cmake -S Laplace-postgres -B "$LAPLACE_BUILD/Laplace-postgres/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLAPLACE_TIER0:FILEPATH="$LAPLACE_TIER0" -DLAPLACE_NATIVE:PATH="$LAPLACE_NATIVE" -DLAPLACE_OPERATIONS:PATH="$GITHUB_WORKSPACE/Laplace-Operations"
          cmake --build "$LAPLACE_BUILD/Laplace-postgres/icx-release"
          ctest --test-dir "$LAPLACE_BUILD/Laplace-postgres/icx-release" --output-on-failure
      - name: Function bindings declared by the build
        run: node Laplace-postgres/tools/check-function-bindings.mjs "$LAPLACE_BUILD/Laplace-postgres/icx-release"
      - name: The database checks parse (they run after deployment, in Laplace-Operations)
        run: |
          bash -n Laplace-postgres/tests/deployed.sh
          python3 -m py_compile Laplace-postgres/tests/stage-lifecycle.py
  # Every merge to main that passes deploys hart-server: Laplace-Operations' deployment runs with every repository at its
  # main (its laplace.yml, on a repository_dispatch main-merged; the token is the secret LAPLACE_CHECKOUT, agents.sh's).
  deploy:
    needs: extension
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laplace, Laplace-postgres]
    steps:
      - name: hart-server deploys main (Laplace-Operations)
        env:
          TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/Laplace-Operations/dispatches" -d '{"event_type": "main-merged", "client_payload": {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}}'
          echo "dispatched: Laplace-Operations deploys hart-server with ${{ github.repository }} at ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
