# Build and qualify the candidate extension in a private package directory and scratch database.
# Shared installation and declared-database migration belong to Operations deployment after merge.
name: Laplace-postgres
env:
  LAPLACE_CONNINFO: ""   # laplace.env's
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  extension:
    runs-on: [self-hosted, laplace, Laplace-postgres]
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-postgres }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", ref: 38f4139bab5ea44f860d5e9e2b322b963b7f5a71, path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: Select qualified inputs for the exact Native revision
        id: native-inputs
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, subprocess
          spec = importlib.util.spec_from_file_location('dependencies', 'Laplace-Operations/.github/scripts/resolve-dependencies.py')
          dependencies = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(dependencies)
          revision = subprocess.check_output(['git', '-C', 'Laplace-Native', 'rev-parse', 'HEAD'], text=True).strip()
          def request(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          run = dependencies.verified_native_run(os.environ['GITHUB_REPOSITORY_OWNER'], revision, request)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={run}\n')
          print(f'Qualified Native inputs: {revision}, run {run}')
          PY
      - name: Receive the independently qualified complete Unicode cache closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: SaltyPatron/Laplace-Native
          run-id: ${{ steps.native-inputs.outputs.run }}
          github-token: ${{ secrets.LAPLACE_CHECKOUT }}
          name: native-prepared-inputs
          path: ${{ runner.temp }}/native-floor-inputs
      - name: Verify and select the candidate cache paths
        run: python3 Laplace-Native/scripts/ci-inputs.py verify "$RUNNER_TEMP/native-floor-inputs"
      - name: build
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_SRC=$GITHUB_WORKSPACE LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native
          cmake -S Laplace-postgres -B "$LAPLACE_BUILD/Laplace-postgres/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$LAPLACE_BUILD/Laplace-postgres/icx-release"
          ctest --test-dir "$LAPLACE_BUILD/Laplace-postgres/icx-release" -R '^configure_incremental$' --output-on-failure
      - name: Install and execute the candidate in an isolated database
        run: |
          . Laplace-Operations/laplace.env
          bash Laplace-postgres/tests/extension-install.sh "$LAPLACE_BUILD/Laplace-postgres/icx-release"
  # Every merge to main that passes deploys hart-server: Laplace-Operations' deployment runs with every repository at its
  # main (its laplace.yml, on a repository_dispatch main-merged; the token is the secret LAPLACE_CHECKOUT, agents.sh's).
  deploy:
    needs: extension
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laplace, Laplace-postgres]
    steps:
      - name: hart-server deploys main (Laplace-Operations)
        env:
          TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/Laplace-Operations/dispatches" -d '{"event_type": "main-merged", "client_payload": {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}}'
          echo "dispatched: Laplace-Operations deploys hart-server with ${{ github.repository }} at ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
